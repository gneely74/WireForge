<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="wireBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark obsidian squircle base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#wireBorder)" stroke-width="2" />

  <!-- Radio wave pulses representing live news / wire audio transmission -->
  <path d="M14 26 A14 14 0 0 0 14 38" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M50 26 A14 14 0 0 1 50 38" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Central Electric Forge Bolt -->
  <polygon points="36,8 20,33 32,33 26,56 46,27 34,27" fill="url(#bolt)" filter="url(#glow)" />
  <polygon points="35,11 23,31 33,31 29,49 41,29 34,29" fill="#ffffff" opacity="0.85" />
</svg>
